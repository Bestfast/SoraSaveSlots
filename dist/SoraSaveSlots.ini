[SoraSaveSlots]
; Save-slot cap raiser for Trails in the Sky 1st Chapter (sora_1st.exe) and
; 2nd Chapter (sora_2nd.exe). Auto-detects the host exe.
;
; Total number of save slots, 999 max (the save-folder name format is save%03d).
;
; Slots 0-174 are the stock ones and 175-199 belong to the game (autosave,
; chapter clears, reserved windows); this mod adds slots 200 .. MaxSlots-1.
; Values of 200 or less therefore add nothing.
;
; Up to 300 only the dialog range lists are patched (v2 behaviour).
; Above 300 the mod also replaces the accessor's slot array with a bigger one
; and raises the icon/page loop bounds - riskier, see README.
;
; sora_2nd stock = 170 slots. sora_1st stock = 175. Set to 200 (or less) to
; effectively disable the mod.
MaxSlots=999

; Autosave history (sora_2nd only). The game keeps a single live autosave slot;
; this mirrors every autosave into a ring of AutosaveSlots extra slots, shown as
; their own menu block, so you keep a rolling history. The live slot is left
; untouched, so "load latest" / Continue keep working exactly as stock.
; 0 = off. Max 64.
AutosaveSlots=10

; Shrink the save/load menus to (last save on disk + 50) tiles instead of
; always showing all MaxSlots slots. 1 = on, 0 = always show MaxSlots.
DynamicWindow=1
